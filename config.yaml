# Textos del análisis. Los marcadores {clave} o {clave:.0f} se llenan con data/processed/resultados.json.
nombre: mexico-arquitectura-precio-tamano
titulo: "¿El tamaño grande siempre sale más barato?"
objetivo: "Mostrar a dueños de negocio y a equipos de revenue management y category management de consumo y retail en México cómo se comporta en el anaquel el precio por tamaño de marcas líderes, y dónde el tamaño grande deja de ahorrar."
pregunta: "En la misma tienda, ¿el precio por litro, kilo o pieza baja al subir el tamaño en marcas líderes?"
preguntas_secundarias:
  - "Para Coca-Cola y otras marcas con varias presentaciones, ¿el precio por litro, kilo o pieza baja al subir el tamaño?"
  - "¿En qué porcentaje de tiendas se rompe la escalera?"
  - "¿Hay cadenas o formatos donde se rompe más?"
  - "¿Qué debe revisar una marca o un retailer en su arquitectura de precios?"
audiencias: [Revenue management de una marca, Category management de una cadena, Analista comercial]
graficas:
  - archivo: 01_escaleras_por_tamano.png
    titulo: "Escaleras de precio por tamaño"
    pie: "Precio por unidad según tamaño en cinco escaleras, con los escalones rotos en verde."
  - archivo: 02_rupturas_por_escalon.png
    titulo: "Rupturas por escalón"
    pie: "% de tiendas donde el tamaño grande cuesta más por unidad."
  - archivo: 03_rupturas_por_formato.png
    titulo: "Rupturas por cadena"
    pie: "% de escalones rotos en cada cadena."
  - archivo: 04_huevo_12_vs_18.png
    titulo: "El caso del huevo"
    pie: "Cambio del precio por pieza al pasar al paquete grande."
readme:
  hallazgo_principal: >-
    **El cartón de 18 huevos San Juan sale más caro por huevo que el de 12 en las {sj_formatos:.0f} cadenas que lo venden.** Pagas
    ${sj_sobreprecio_18:.2f} de más por cartón (+{sj_12_18:.1f}% por huevo) y pasa en {sj_formato_min:.1f}% a 100% de las tiendas de cada cadena. Si seis
    competidores repiten lo mismo, no parece decisión de una tienda: parece venir de la lista de precios.


    Medido por tienda: **En {roto_sj_12_18:.0f}% de las tiendas (IC90 {roto_sj_12_18_inf:.0f}–{roto_sj_12_18_sup:.0f}%), un huevo San Juan cuesta
    más en el paquete de 18 que en el de 12; en Coca-Cola, la escalera se rompe en solo {roto_coca:.1f}% de los escalones.**
    En las cinco marcas analizadas, {roto_total:.0f}% de los {escalones:,.0f} escalones están rotos: el tamaño grande cuesta más
    por unidad que el chico en la misma tienda. La ruptura no se reparte: cada marca la concentra en un escalón.
  grafica_principal: outputs/charts/01_escaleras_por_tamano.png
  alt_grafica: "Precio por unidad según tamaño en cinco marcas, con los escalones rotos resaltados"
  nota_principal: >-
    Escalón = un tamaño contra el siguiente más grande que tiene la tienda, por litro, kilo o pieza. Escalón roto = el tamaño
    grande cuesta más por unidad. IC90 = rango probable, por bootstrap de tiendas y municipios. Reporte interactivo: https://ernestrr.github.io/mexico-arquitectura-precio-tamano/
  hallazgos_apoyo:
    - >-
      **Cada marca rompe su escalera en un escalón.** Huevo El Calvario de 18 a 30 piezas: roto en {roto_ec_18_30:.0f}% de las
      tiendas (IC90 {roto_ec_18_30_inf:.0f}–{roto_ec_18_30_sup:.0f}%). Chiles La Costeña en rajas de 240 a 340 g: {roto_raj_240_340:.0f}%
      (IC90 {roto_raj_240_340_inf:.0f}–{roto_raj_240_340_sup:.0f}%). Zucaritas de 380 a 600 g: {roto_zuc_380_600:.0f}%. En los otros
      escalones la escalera funciona: en Coca-Cola, el litro baja {coca_lata_600:.0f}% de lata a 600 ml y {coca_1_275:.0f}% de 1 L a 2.75 L.
    - >-
      **La ruptura viene del producto, no de la cadena.** El escalón de 12 a 18 huevos San Juan está roto en
      {sj_formato_min:.0f}% a {sj_formato_max:.0f}% de las tiendas de cada una de las {sj_formatos:.0f} cadenas con datos. Por cadena, el % de
      escalones rotos va de {formato_min:.0f}% a {formato_max:.0f}%, pero sobre todo por la mezcla de productos que vende cada una: con la
      misma mezcla, ninguna se aleja más de {ajuste_max_pp:.0f} puntos de lo esperado.
    - >-
      **Son pocos pesos por paquete, pero rompen una promesa.** Donde la escalera está rota, el paquete de 18 huevos San Juan cuesta
      ${sj_sobreprecio_18:.2f} más que 18 huevos al precio por pieza del de 12, y el de 30 huevos El Calvario ${ec_sobreprecio_30:.2f}
      más que 30 al precio del de 18. Típicamente, un huevo San Juan cuesta ${sj_pu_12:.2f} en el paquete de 12, ${sj_pu_18:.2f} en el
      de 18 y ${sj_pu_30:.2f} en el de 30.
  no_solido: >-
    El % roto por marca mezcla escalones muy distintos y su rango probable es amplio (huevo San Juan: {roto_sj:.0f}%, IC90
    {roto_sj_inf:.0f}–{roto_sj_sup:.0f}%); por eso las cifras principales son por escalón. La cadena con más rupturas (Chedraui Selecto,
    {formato_max:.0f}%) tiene solo 3 tiendas, y Superissste no tiene ninguna ruptura pero sí muchos escalones planos (descuento menor a
    5%). En chiles La Costeña, el resultado depende de qué escalones se cuentan: solo con tamaños contiguos, el % roto sube de
    {roto_raj:.0f}% a casi el doble.
  alcance: "Aplica a los supermercados que monitorea PROFECO, no a todo el mercado. Solo precio al consumidor: no se observan costos de empaque ni ventas por tamaño."
  acciones:
    "Revenue management de una marca":
      - "**Audite el escalón, no la marca.** La ruptura se concentra en un paso: 12 a 18 huevos ({roto_sj_12_18:.0f}% de las tiendas), 18 a 30 ({roto_ec_18_30:.0f}%), 240 a 340 g de rajas ({roto_raj_240_340:.0f}%). Revise el precio de lista de esos tamaños."
      - "**Si la ruptura está en todas las cadenas, apunta a su lista de precios.** El escalón de 12 a 18 huevos San Juan está roto en {sj_formato_min:.0f}–{sj_formato_max:.0f}% de las tiendas de cada cadena."
      - "**Copie la disciplina de Coca-Cola:** cada tamaño más grande baja con claridad el precio por litro, y solo {roto_coca:.1f}% de los escalones se rompe."
    "Category management de una cadena":
      - "**Revise el anaquel con el precio por unidad.** Un escalón roto hace que el cliente informado compre el tamaño chico, o que el que no compara pague de más."
      - "**Marque los escalones planos y rotos en su sistema de precios.** {plano_total:.0f}% de los escalones son planos (descuento menor a 5%) y {roto_total:.0f}% están rotos."
      - "**Use la etiqueta de precio por unidad como herramienta, no como trámite:** es la que hace visible la escalera."
    "Analista comercial":
      - "**Defina la variante antes de comparar tamaños.** Bimbo y los yoghurts parecen tener 3 tamaños, pero mezclan pan tostado con pan de caja y vaso con bebible."
      - "**Reporte por escalón y por tamaños contiguos.** El promedio por marca mezcla escalones sanos con rotos y su rango probable es muy amplio."
  como_se_hizo:
    - "Precios de tienda (mediana de la quincena) de supermercados monitoreados por PROFECO del 16 al 31 de agosto de 2026."
    - "Selección: escaleras con 3 tamaños o más de la misma variante en 100 tiendas o más: Coca-Cola regular, huevo blanco San Juan y El Calvario, Zucaritas y chiles jalapeños en rajas La Costeña."
    - "Escalones chico → grande en la misma tienda (motor `pares.tamanos`), por litro, kilo o pieza: {escalones:,.0f} escalones en {tiendas:.0f} supermercados de {municipios:.0f} municipios."
    - "% de escalones rotos con IC90 por bootstrap de tiendas y municipios (500 réplicas, semilla 2026); desglose por escalón, marca y cadena."
  limitaciones:
    - "**Universo:** solo tiendas monitoreadas por PROFECO; no es una muestra representativa de todos los establecimientos."
    - "**Periodo:** una quincena (16–31 ago 2026); una promoción en un tamaño puede romper un escalón por unos días."
    - "**Selección:** cinco escaleras de marcas con cobertura amplia; no describe todas las marcas del anaquel."
    - "**Envases distintos:** en Coca-Cola la lata y la botella son envases distintos de la misma bebida."
    - "**Causalidad:** el análisis no dice por qué una escalera se rompe (costos, promociones o precios de lista)."
  metodo: |-
    **00 · Datos y selección.** Tabla común `precio_tienda_sku` unida a `tiendas` y `sku_catalogo`. Se revisaron diez escaleras
    candidatas (lista en `data/metadata/seleccion_marcas.csv`). Entran las que tienen 3 tamaños o más de la misma variante y 100 tiendas
    o más con al menos 3 tamaños. No entran: pan Bimbo y yoghurt (mezclan productos distintos), café Nescafé (2 tamaños por variante),
    agua Ciel ({ciel_t3:.0f} tiendas), galletas Saladitas y caldo Knorr (casi ninguna tienda con los tres tamaños). Presentaciones
    ambiguas fuera. Solo Coca-Cola tiene empresa propietaria verificada; para las demás no se menciona la empresa.

    **01 · Escalera por marca.** Cambio del precio por unidad en cada escalón contiguo (mediana de las tiendas).

    **02 · Rupturas.** % de escalones con el tamaño grande más caro por unidad; «plano» = descuento menor a 5%. IC90 por bootstrap de
    dos vías (escalones y municipios). Sensibilidad del total: entre {sens_total_min:.1f}% y {sens_total_max:.1f}% (solo contiguos, sin
    extremos, ruptura mayor a 1%); huevo San Juan entre {sens_sj_min:.1f}% y {sens_sj_max:.1f}%.

    **03 · Cadenas y formatos.** % roto por formato con 20 escalones o más; comparación contra lo esperado con la misma mezcla de
    escalones.

    **04 · Qué revisar.** Sobreprecio por empaque = (precio por unidad del grande − del chico) × tamaño del grande, en las tiendas con el
    escalón roto.

    **05 · Visualizaciones.** Gráficas, versiones para publicar y reporte interactivo.
  fuentes:
    - "**The Coca-Cola Company**, Form 10-K 2025 (propiedad de la marca Coca-Cola): https://www.sec.gov/Archives/edgar/data/21344/000162828026010047/ko-20251231.htm"
reporte:
  descripcion: "En qué marcas y tamaños el empaque grande cuesta más por unidad que el chico en la misma tienda. PROFECO, agosto de 2026."
  h1: "En <span class='pos'>{roto_sj_12_18:.0f}%</span> de las tiendas, un huevo San Juan cuesta más en el paquete de 18 que en el de 12"
  intro: >-
    {escalones:,.0f} escalones de tamaño (chico contra grande, mismo producto y variante, misma tienda) en {tiendas:.0f} supermercados de
    {municipios:.0f} municipios, monitoreados por PROFECO del 16 al 31 de agosto de 2026.
  stats:
    - valor: "{roto_sj_12_18:.0f}%"
      clase: pos
      texto: "de las tiendas con el escalón de 12 a 18 huevos San Juan roto (IC90 {roto_sj_12_18_inf:.0f}–{roto_sj_12_18_sup:.0f}%)"
    - valor: "{roto_ec_18_30:.0f}%"
      clase: pos
      texto: "con el escalón de 18 a 30 huevos El Calvario roto"
    - valor: "{roto_coca:.1f}%"
      clase: ""
      texto: "de los escalones de Coca-Cola rotos"
    - valor: "{roto_total:.0f}%"
      clase: ""
      texto: "de los {escalones:,.0f} escalones de las cinco marcas están rotos"
  metodo:
    - "Escaleras con 3 tamaños o más de la misma variante en 100 tiendas o más; la variante se define por el texto de la presentación."
    - "Escalón = un tamaño contra el siguiente más grande en la misma tienda (motor de pares), por litro, kilo o pieza."
    - "% roto con IC90 por bootstrap de tiendas y municipios (500 réplicas, semilla 2026)."
    - "Solo precio al consumidor en tiendas monitoreadas por PROFECO; ningún resultado implica causalidad."
